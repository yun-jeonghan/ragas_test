[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "graphrag-eval"
version = "0.1.0"
description = "GraphRAG evaluation harness with Ragas scoring and graph aware metrics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Jeonghan Yun" }
]
dependencies = [
  "pydantic>=2.7",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "pypdf>=4.0",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "ragas>=0.1.21",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]
cpu = [
  "sentence-transformers>=3.0",
]

[project.scripts]
grev = "graphrag_ragas_eval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag_ragas_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
